buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    // Same Compose compiler wiring as @expo/ui, which already ships Compose in the app.
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.astrawidget'
version = '0.1.0'

android {
  namespace "expo.modules.astrawidget"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    // The bucket math constructs android.util.SizeF; stubs return defaults in JVM tests.
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // Cold-start playback for the widget's buttons (AstraCarCommandService).
  implementation project(':astra-car')

  // Pinned to @expo/ui's versions so the Customize sheet adds no second copy of Compose.
  implementation 'androidx.compose.foundation:foundation-android:1.10.6'
  implementation 'androidx.compose.ui:ui-android:1.10.6'
  implementation 'androidx.compose.material3:material3-android:1.5.0-alpha17'
  // The version the app already resolves.
  implementation 'androidx.activity:activity:1.8.2'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
